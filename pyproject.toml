[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ocr-service"
version = "1.0.0"
description = "OCR pipeline for financial/accounting documents with print + handwriting support."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "pillow>=10.2",
    "requests>=2.31",
    "slowapi>=0.1.9",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
# Heavy ML runtime kept separate so the core/API and tests install fast.
ocr = [
    "paddlepaddle>=2.6",
    "paddleocr>=2.7",
    "transformers>=4.39",
    "torch>=2.2",
    "pymupdf>=1.24",
]
dev = [
    "pytest>=8.1",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.9",
]

[project.scripts]
ocr-service = "ocr_service.app:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 90
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["B008"]  # FastAPI uses function calls (Depends/File) in defaults.

[tool.mypy]
python_version = "3.10"
packages = ["ocr_service"]
ignore_missing_imports = true   # heavy ML libs ship without type stubs
warn_unused_ignores = true
