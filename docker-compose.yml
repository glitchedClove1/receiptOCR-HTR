services:

  # ── Ollama inference server ─────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      # NB: the ollama/ollama image ships neither curl nor wget — the ollama
      # CLI itself is the only reliable probe.
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    # GPU support — uncomment the block below if you have an NVIDIA GPU and
    # nvidia-container-toolkit installed on the host.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # ── Pull required models on first start ────────────────────────────────────
  # This one-shot container runs after Ollama is healthy and pulls the two
  # models the service uses. It exits once the pull is complete; subsequent
  # `docker compose up` calls skip the pull because the weights are in the
  # ollama_data volume.
  ollama-init:
    image: curlimages/curl:latest
    depends_on:
      ollama:
        condition: service_healthy
    # Pull VLM (primary) then text fallback. -f makes an HTTP error fail the
    # init container (otherwise the stack would boot with no models and
    # silently return empty fields). --max-time 7200 accommodates cold ~2-3GB
    # pulls on slow links; already-present models return immediately.
    entrypoint: ["/bin/sh", "-c"]
    # A single-element YAML list, not a plain scalar: Compose passes this one
    # string through verbatim as argv[2] instead of re-tokenizing it, so a
    # leading quote character can't get glued onto "curl" and break the
    # command lookup (previously caused a spurious "exit 127").
    #
    # stream defaults to true (omitted below) so Ollama sends continuous
    # NDJSON progress lines instead of holding the connection silent for the
    # whole multi-GB download — the silent connection was getting dropped by
    # the Docker Desktop network path partway through, failing with curl
    # exit 52 ("empty reply from server").
    command:
      - >-
        curl -sf -X POST http://ollama:11434/api/pull
        -d '{"name":"qwen2.5vl:3b"}' --max-time 7200 &&
        curl -sf -X POST http://ollama:11434/api/pull
        -d '{"name":"qwen2.5:3b"}' --max-time 7200
    restart: "no"

  # ── OCR service ─────────────────────────────────────────────────────────────
  ocr:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    environment:
      # Ollama sidecar address (matches the service name above).
      OCR_OLLAMA_BASE_URL: "http://ollama:11434"
      OCR_VLM_MODEL: "qwen2.5vl:3b"
      OCR_OLLAMA_MODEL: "qwen2.5:3b"
      # Tune these via environment or a .env file — no rebuild required.
      OCR_CONFIDENCE_THRESHOLD: "0.80"
      OCR_PADDLE_PRIMARY_LANG: "fr"
      OCR_USE_GPU: "false"
      OCR_LOG_LEVEL: "INFO"
      # Set a non-empty key to require X-API-Key on /v1 routes.
      OCR_API_KEY: ""
    volumes:
      # Result cache — identical documents return instantly on re-upload,
      # and generated workbooks live here (served via /v1/download).
      - ocr_cache:/srv/.ocr_cache
      # HuggingFace + PaddleOCR weight caches — persist across rebuilds.
      # Mount points are pre-created and chowned in the Dockerfile so the
      # non-root user can write to them. PaddleOCR 3.x caches under
      # ~/.paddlex (not ~/.paddleocr).
      - hf_cache:/home/appuser/.cache/huggingface
      - paddle_cache:/home/appuser/.paddlex

volumes:
  ollama_data:   # Ollama model weights
  ocr_cache:     # Processed document cache
  hf_cache:      # HuggingFace model weights (TrOCR)
  paddle_cache:  # PaddleOCR model weights
